<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Pagamento cancelado · AI/R Coffee</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('aircoffee.theme');
        var theme = saved === 'dark' || saved === 'light'
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { /* sem storage */ }
    })();
  </script>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="return-page">
  <main class="return-card">
    <span class="return-icon return-icon--warn" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="36" height="36" fill="none">
        <path d="M12 8v5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
        <circle cx="12" cy="16.5" r="1.4" fill="currentColor" />
      </svg>
    </span>
    <h1>Pagamento cancelado</h1>
    <p>Nenhum valor foi cobrado. Você pode voltar ao carrinho para revisar o pedido ou continuar comprando.</p>
    <a class="btn btn--solid" href="../index.html#/carrinho">Voltar para o carrinho</a>
  </main>
</body>
</html>
