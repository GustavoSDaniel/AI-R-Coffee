server:
  port: 7070

spring:
  application:
    name: ai-r-coffee-api
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:7071}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ai-r-coffee-apiHikariPool
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:7072/auth/realms/ai-r-coffee-realm}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:7072/auth/realms/ai-r-coffee-realm/protocol/openid-connect/certs}
springdoc:
  swagger-ui:
    path: /swagger-ui.html

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
