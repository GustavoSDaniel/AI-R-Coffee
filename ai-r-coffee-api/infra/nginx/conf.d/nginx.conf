limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# 1. Redireciona todo o tráfego HTTP para HTTPS
server {
    listen 80;
    server_name api.ai-r-coffe.gustavosdaniel.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor Seguro (HTTPS)
server {
    listen 443 ssl;
    server_name api.ai-r-coffe.gustavosdaniel.com;

    ssl_certificate /etc/letsencrypt/live/api.ai-r-coffe.gustavosdaniel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ai-r-coffe.gustavosdaniel.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # O DNS interno do Docker
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Rota do Keycloak
    location /auth/ {
        set $auth_host keycloak:8080;
        proxy_pass http://$auth_host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Rota geral da API Spring Boot
    location / {
        limit_req zone=api_limit burst=20 nodelay;

        # [CORRIGIDO] Nome exato do container definido no docker-compose.yml
        set $api_host ai-r-coffee-api:7070;

        proxy_pass http://$api_host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Garante que os headers CORS do cliente cheguem ao backend
        proxy_pass_request_headers on;
        proxy_set_header Origin $http_origin;
    }
}